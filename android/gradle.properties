# El `java` del sistema es 11 y AGP necesita 17+; usamos el JDK que trae Android Studio.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Servidor. Cambia esto por la URL que te devuelva `wrangler deploy`.
# De vuelta al servidor local del emulador para seguir probando. Antes de
# instalarla en el telefono real de tu pareja, cambia esto por la URL que
# te devuelva `wrangler deploy` (ver README.md).
woop.baseUrl=http://10.0.2.2:8787

# Otras opciones (solo funcionan en compilaciones debug):
#   servidor de produccion -> woop.baseUrl=https://woop.TU-SUBDOMINIO.workers.dev
#   movil real en tu wifi  -> woop.baseUrl=http://LA-IP-DE-TU-LAPTOP:8787
